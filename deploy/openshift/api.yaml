apiVersion: v1
kind: ConfigMap
metadata:
  name: stm-api-config
  labels:
    app.kubernetes.io/name: stm-api
    app.kubernetes.io/part-of: slack-thread-manager
data:
  NODE_ENV: production
  PORT: "3000"
  KEYCLOAK_REALM_URL: https://stm-keycloak-slack-thread-manager.apps.ocp4.shebi.eu/realms/slack-thread-manager
  KEYCLOAK_CLIENT_ID: slack-thread-manager-web
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stm-api
  labels:
    app.kubernetes.io/name: stm-api
    app.kubernetes.io/part-of: slack-thread-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: stm-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stm-api
        app.kubernetes.io/part-of: slack-thread-manager
    spec:
      containers:
        - name: api
          image: image-registry.openshift-image-registry.svc:5000/slack-thread-manager/stm-api:latest
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: stm-api-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: stm-postgres
                  key: DATABASE_URL
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 512Mi
              cpu: 500m
---
apiVersion: v1
kind: Service
metadata:
  name: stm-api
  labels:
    app.kubernetes.io/name: stm-api
    app.kubernetes.io/part-of: slack-thread-manager
spec:
  selector:
    app.kubernetes.io/name: stm-api
  ports:
    - port: 3000
      targetPort: 3000
