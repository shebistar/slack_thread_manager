apiVersion: v1
kind: Secret
metadata:
  name: stm-postgres
  labels:
    app.kubernetes.io/name: stm-postgres
    app.kubernetes.io/part-of: slack-thread-manager
type: Opaque
stringData:
  POSTGRES_USER: stm_dev
  POSTGRES_PASSWORD: stm_dev_password
  POSTGRES_DB: slack_thread_manager
  DATABASE_URL: postgresql://stm_dev:stm_dev_password@stm-postgres:5432/slack_thread_manager
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stm-postgres
  labels:
    app.kubernetes.io/name: stm-postgres
    app.kubernetes.io/part-of: slack-thread-manager
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: stm-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stm-postgres
        app.kubernetes.io/part-of: slack-thread-manager
    spec:
      containers:
        - name: postgres
          image: docker.io/pgvector/pgvector:pg17
          ports:
            - containerPort: 5432
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          envFrom:
            - secretRef:
                name: stm-postgres
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - stm_dev
                - -d
                - slack_thread_manager
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 512Mi
              cpu: 500m
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: stm-postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: stm-postgres
  labels:
    app.kubernetes.io/name: stm-postgres
    app.kubernetes.io/part-of: slack-thread-manager
spec:
  selector:
    app.kubernetes.io/name: stm-postgres
  ports:
    - port: 5432
      targetPort: 5432
