apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: stm-postgres-pvc
  labels:
    app.kubernetes.io/name: stm-postgres
    app.kubernetes.io/part-of: slack-thread-manager
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-models
  labels:
    app.kubernetes.io/name: stm-ollama
    app.kubernetes.io/part-of: slack-thread-manager
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
