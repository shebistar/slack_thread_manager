apiVersion: apps/v1
kind: Deployment
metadata:
  name: stm-web
  labels:
    app.kubernetes.io/name: stm-web
    app.kubernetes.io/part-of: slack-thread-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: stm-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stm-web
        app.kubernetes.io/part-of: slack-thread-manager
    spec:
      containers:
        - name: web
          image: image-registry.openshift-image-registry.svc:5000/slack-thread-manager/stm-web:latest
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests:
              memory: 64Mi
              cpu: 50m
            limits:
              memory: 128Mi
              cpu: 200m
---
apiVersion: v1
kind: Service
metadata:
  name: stm-web
  labels:
    app.kubernetes.io/name: stm-web
    app.kubernetes.io/part-of: slack-thread-manager
spec:
  selector:
    app.kubernetes.io/name: stm-web
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: stm-web
  labels:
    app.kubernetes.io/name: stm-web
    app.kubernetes.io/part-of: slack-thread-manager
  annotations:
    haproxy.router.openshift.io/timeout: 15m
spec:
  host: stm-web-slack-thread-manager.apps.ocp4.shebi.eu
  to:
    kind: Service
    name: stm-web
    weight: 100
  port:
    targetPort: 8080
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
